name: ci-master-pr

on:
  push:
    branches:
    - master
    tags:
    - '**'
  pull_request:
    branches:
    - master

jobs:
  ci-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v3
      - id: matrix
        run: |
          echo "matrix=$( jq -c '{include: .}' games.json )" >> "$GITHUB_OUTPUT"

  test-build-hlds:
    runs-on: ubuntu-24.04
    container:
      image: docker:28-cli
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
    - uses: actions/checkout@v3
    - name: Ignore git permissions
      run: |
        git config --global --add safe.directory "$( pwd )"
    - name: Test build
      run: |
        ./build.sh --env-file ./test/build-hlds-cstrike.env
      env:
        STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
    - name: Test update
      run: |
        ./build.sh --env-file ./test/update-hlds-cstrike.env
      env:
        STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}

  test-build-srcds:
    runs-on: ubuntu-24.04
    container:
      image: docker:28-cli
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
    - uses: actions/checkout@v3
    - name: Ignore git permissions
      run: |
        git config --global --add safe.directory "$( pwd )"
    - name: Test build
      run: |
        ./build.sh --env-file ./test/build-srcds-hl2mp.env
      env:
        STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
    - name: Test update
      run: |
        ./build.sh --env-file ./test/update-srcds-hl2mp.env
      env:
        STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}

  test-game-image-game-version:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - name: Test
      run: |
        ./test/test-game-image-game-version.sh

  test-generate-gitbranches:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch all branches and tags
    - name: Test
      shell: pwsh
      run: |
        ./Generate-GitBranches.Tests.ps1

  update-draft-release:
    needs:
    - test-build-hlds
    - test-build-srcds
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
    - uses: release-drafter/release-drafter@v5
      with:
        config-name: release-drafter.yml
        publish: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-draft-release:
    needs:
    - test-build-hlds
    - test-build-srcds
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
    - uses: release-drafter/release-drafter@v5
      with:
        config-name: release-drafter.yml
        publish: true
        name: ${{ github.ref_name }} # E.g. 'master' or 'v1.2.3'
        tag: ${{ github.ref_name }} # E.g. 'master' or 'v1.2.3'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dockerhub-description:
    runs-on: ubuntu-24.04
    needs:
    - ci-matrix
    - test-build-hlds
    - test-build-srcds
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-matrix.outputs.matrix) }}
    name: dockerhub-description (${{ matrix.game_engine }}/${{ matrix.game }})
    steps:
    - uses: actions/checkout@v3
    - uses: peter-evans/dockerhub-description@v3
      with:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
        repository: ${{ matrix.docker_repository }}"
        short-description: ${{ matrix.game_name }} (${{ matrix.game_engine }}) 🐳
        readme-filepath: docs/readme/${{ matrix.game_engine }}-${{ matrix.game }}.md
